    No deprecation policy published. No `Deprecation` pointer is emitted.
    The largest lifecycle event in the record is a divestiture rather than a
    deprecation: in April 2026 GigaIO sold its datacenter technology and assets,
    including SuperNODE and FabreX, to d-Matrix, and FabreX is now a d-Matrix
