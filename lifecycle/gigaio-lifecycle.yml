description: >-
  Lifecycle posture for GigaIO's public surface. GigaIO publishes no API versioning
  policy, no deprecation policy, no Sunset/Deprecation header commitment, no SLA and no
  status page. Support is an email address plus an Atlassian Jira Service Management
  customer portal that requires a login. The one dated, public, machine-readable change
  signal is the WordPress news feed.
