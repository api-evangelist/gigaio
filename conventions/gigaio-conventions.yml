reversibility:
  grade: na
  applicable: false
  detail: >-
    No public write surface exists to reverse. GigaIO publishes no OpenAPI and no API
    reference; the single reachable machine endpoint is an OAuth-protected MCP server
    whose tool set could not be introspected anonymously, so neither its write
    operations nor any reversal path can be observed. GigaIO's product control plane
    (FabreX composability via DMTF Redfish) unquestionably has write operations —
    composing and decomposing resources into a server is inherently a reversible
    action, and Redfish itself defines the DELETE/reset semantics — but GigaIO
    publishes no reference stating any of that, and no window is stated anywhere
    public. Recording `na` rather than a guessed window is deliberate: an invented
    reversal window is the one error in this pipeline that could cost a user real
    money or a live cluster.
