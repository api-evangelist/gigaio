description: >-
  GigaIO runs a remote Model Context Protocol server on its own domain at
  https://gigaio.com/wp-json/mcp/mcp-oauth-server, advertised through an RFC 9728
  protected-resource document and backed by an RFC 8414 authorization server at
  https://gigaio.com. A second, unauthenticated-by-name endpoint,
  /wp-json/mcp/mcp-adapter-default-server, is registered in the same namespace and
  also refuses anonymous calls.

  WHAT THIS SERVER IS, PLAINLY. It is the WordPress MCP Adapter running on GigaIO's
  marketing site (gigaio.com is WordPress on WP Engine), so the abilities it exposes
  are site/content abilities, not the FabreX or Gryf product control plane. It is,
  however, a deliberate deployment and not a hosting default: the `mcp` REST namespace
  is absent from other WP Engine and WordPress sites probed the same day
  (wpengine.com, ma.tt, techcrunch.com all expose `wp-abilities/v1` but no `mcp`
  namespace), and the OAuth authorization server with scope "mcp" had to be configured
  in addition to the adapter. GigaIO's product APIs (DMTF Redfish for FabreX fabric
  management) are documented only behind the customer support portal and are not
  reachable from this server.
