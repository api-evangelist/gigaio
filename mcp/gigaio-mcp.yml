    auth: unknown
    note: >-
      Registered in the same `mcp` namespace. An anonymous tools/list returns
      HTTP 401 rest_forbidden, so it is gated too; no metadata document names it.
tools: []
tools_note: >-
  NOT CAPTURED — the live tool list is auth-gated. An anonymous JSON-RPC
  {"jsonrpc":"2.0","id":1,"method":"tools/list"} against
  https://gigaio.com/wp-json/mcp/mcp-oauth-server returns HTTP 401
  {"code":"mcp_unauthorized","message":"MCP authentication required."}, and the same
  call against /wp-json/mcp/mcp-adapter-default-server returns HTTP 401 rest_forbidden.
  GigaIO publishes no llms.txt and no MCP documentation page, so there is no published
  tool list to fall back to. Tool names and inputSchemas require authenticated
  introspection with an OAuth token in the "mcp" scope. Nothing is inferred here.
