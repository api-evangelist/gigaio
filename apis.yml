aid: gigaio
name: GigaIO
description: >-
  GigaIO is a Carlsbad, California hardware and software company building
  datacenter-class computing for the edge. Its current product line is Gryf, a
  carry-on suitcase-sized, ruggedized, field-serviceable AI supercomputer built from
  hot-swappable Accelerator, Compute, Network and Storage sleds, plus Manticore for
  larger deployments. The company was founded around FabreX, a PCIe/CXL-based
  composable memory fabric that disaggregates GPUs, FPGAs, NVMe and DRAM into
  dynamically composed clusters and is managed with DMTF Redfish RESTful APIs and a
  FabreX CLI that integrates with Ansible, Chef, Puppet, Slurm, OpenPBS, LSF and
  Kubernetes. In April 2026 GigaIO sold its datacenter technology and assets —
  including SuperNODE and FabreX — to d-Matrix, and refocused the company on edge AI
  inferencing. GigaIO publishes no public developer portal, API reference or
  machine-readable specification; the API documentation and knowledge base sit behind
  its Atlassian-hosted customer support portal. It does run a remote Model Context
  Protocol server on gigaio.com, protected by OAuth 2.0 with PKCE.
