  detail: >-
    GigaIO ships no public developer program — its FabreX/Redfish API reference and
    knowledge base sit behind an Atlassian Jira Service Management customer login at
    gigaio.atlassian.net, and the FabreX CLI page tells readers to "CONTACT US for
    details on APIs" — but STEP 0b contract discovery did not come back empty. GigaIO
    deliberately runs a remote, OAuth-protected Model Context Protocol server on its
    own host at https://gigaio.com/wp-json/mcp/mcp-oauth-server, advertised by RFC 8414
    and RFC 9728 discovery documents that were captured verbatim here. The `mcp` REST
    namespace is not a WordPress or WP Engine default (wpengine.com, ma.tt and
    techcrunch.com expose wp-abilities/v1 but no mcp namespace), so it was installed on
    purpose. The tool list itself is auth-gated and was not introspected.
  evidence:
